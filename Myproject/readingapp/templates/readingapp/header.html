{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookClub</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

/* ===== BODY ===== */
body {
    background: linear-gradient(50deg, #0f172a, #1e293b);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    overflow-x: hidden;
}

/* ===== NAVBAR ===== */
.navbar {
    background: rgba(15, 23, 42, 0.9) !important;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
}

.navbar-brand {
    font-weight: 700;
    letter-spacing: 0.5px;
}

.navbar-nav .nav-link {
    color: #d1d5db !important;
    margin-right: 0.75rem;
    font-weight: 500;
}

.navbar-nav .nav-link:hover {
    color: #ffffff !important;
}

.search-box {
    border-radius: 999px;
    min-width: 260px;
}

.navbar .btn-light,
.navbar .toggle-button {
    border-radius: 999px;
    min-width: 44px;
    padding: 0.55rem 0.9rem;
}

.toggle-button {
    background-color: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.24);
    transition: background-color 0.3s ease, color 0.3s ease;
}

.toggle-button:hover {
    background-color: rgba(255, 255, 255, 0.2);
}

.light-mode {
    background: #f8fafc;
    color: #0f172a;
}

.light-mode .navbar {
    background: rgba(255, 255, 255, 0.95) !important;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
}

.light-mode .navbar-brand,
.light-mode .nav-link,
.light-mode .lang-placeholder,
.light-mode .toggle-button,
.light-mode .search-box {
    color: #0f172a !important;
}

.light-mode .toggle-button {
    background-color: rgba(15, 23, 42, 0.12) !important;
    border-color: rgba(15, 23, 42, 0.18) !important;
}

..light-mode .toggle-button:hover {
    background-color: rgba(15, 23, 42, 0.16) !important;
}

.light-mode .hero-container::before {
    background: linear-gradient(135deg, rgba(248, 250, 252, 0.9), rgba(248, 250, 252, 0.7));
}

.light-mode .slide h1,
.light-mode .slide p {
    color: #0f172a !important;
}

/* ===== HERO ===== */
.hero-container {
    position: relative;
    overflow: hidden;
    height: 35vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1rem;
}

.hero-container::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(15,23,42,0.85), rgba(15,23,42,0.55));
    z-index: 1;
}

.slider-track {
    display: flex;
    width: 300%;
    animation: slideText 15s linear infinite;
    position: relative;
    z-index: 2;
}

.slide {
    width: 100%;
    flex-shrink: 0;
    padding: 0 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.slide h1,
.slide p {
    color: #fff;
}

.slide h1 {
    font-size: clamp(2.4rem, 4vw, 4rem);
    margin-bottom: 0.75rem;
    font-weight: 800;
}

.slide p {
    font-size: clamp(1rem, 1.25vw, 1.4rem);
    color: #d1d5db;
}

@keyframes slideText {
    0% { transform: translateX(0%); }
    25% { transform: translateX(0%); }
    33% { transform: translateX(-100%); }
    58% { transform: translateX(-100%); }
    66% { transform: translateX(-200%); }
    91% { transform: translateX(-200%); }
    100% { transform: translateX(0%); }
}

/* ===== ORBIT ===== */
.orbit-container {
    position: absolute;
    width: 100%;
    height:100%;
}

/* AUTHOR STYLE */
.author {
    position: absolute;
    font-size: 18px;
    opacity: 0.8;
    white-space: nowrap;
    transition: all 0.2s ease-in-out;
    will-change: transform;
}

</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-3">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center text-white" href="#">
      <img src="{% static 'image/logobook.png' %}" width="40" class="mr-2">
      <span class="lang-text" data-en="BookClub" data-hi="बुक क्लब">BookClub</span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <form class="form-inline ml-auto mr-3" action="{% url 'homepage' %}" method="get">
        <input class="form-control search-box mr-2 lang-placeholder" type="text" name="search" placeholder="Search Book" data-en="Search Book" data-hi="किताब खोजें" value="{{ request.GET.search|default:'' }}">
        <button class="btn btn-light" type="submit" title="Search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>

      <div class="navbar-nav align-items-center">
        <a class="nav-link lang-text" data-en="Login" data-hi="लॉगिन" href="/login">Login</a>
        <a class="nav-link lang-text" data-en="Register" data-hi="रजिस्टर" href="/register">Register</a>
        <button id="theme-toggle" class="btn toggle-button ml-2">🌙</button>
        <button id="lang-toggle" class="btn toggle-button ml-2">हिंदी</button>
      </div>
    </div>
  </div>
</nav>

<div class="hero-container">
    <div class="orbit-container" id="orbit"></div>

    <div class="slider-track">
        <div class="slide">
            <h1>Discover Amazing Books 📖</h1>
            <p>Find your next favorite book</p>
        </div>
        <div class="slide">
            <h1>Explore New Stories 🌟</h1>
            <p>Every page brings a new adventure.</p>
        </div>
        <div class="slide">
            <h1>Read, Learn, Grow 📚</h1>
            <p>Join the community of readers today.</p>
        </div>
    </div>
</div>
