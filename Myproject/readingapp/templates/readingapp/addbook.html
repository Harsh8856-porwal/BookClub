{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/220cb8914d.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: #f8fafc;
            color: #0f172a;
            font-family: 'Segoe UI', sans-serif;
        }

        .card,
        .page-card {
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }

        .page-card {
            margin-top: 1%;
            border-radius: 0.5rem;
        }

        .form-control,
        .form-control-file {
            background-color: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }

        .form-control:focus {
            background-color: #ffffff;
            color: #0f172a;
        }

        .btn.btn-light {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
        }

        .dark-mode {
            background: #0f172a;
            color: #f8fafc;
        }

        .dark-mode .card,
        .dark-mode .page-card {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .dark-mode .form-control,
        .dark-mode .form-control-file {
            background-color: #111827;
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .dark-mode .form-control:focus {
            background-color: #111827;
            color: #f8fafc;
        }

        .dark-mode .container {
            background: #1e293b !important;
            border-color: rgba(255,255,255,0.12) !important;
        }

        .dark-mode h3 {
            background-color: #080e16 !important;
            color: #f8fafc !important;
        }

        .dark-mode .btn.btn-light {
            background-color: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.24);
            color: #f8fafc;
        }

        .dark-mode .btn.btn-primary {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .dark-mode .btn.btn-danger {
            background-color: #ef4444;
            border-color: #ef4444;
            color: #ffffff;
        }

        .dark-mode h3,
        .dark-mode h1,
        .dark-mode label,
        .dark-mode .card-title,
        .dark-mode p {
            color: #f8fafc;
        }

        .theme-toggle-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body class="light-mode">

  <button id="theme-toggle" class="btn btn-light theme-toggle-button">🌙</button>

  <h3 style="background-color: #d879c5; padding:15px; color: #931883;"> Welcome! {{request.user}}</h3>
  <h1 style="text-align: center; margin-top:2%;"><font font-weight="bold" face="Gabriola"> Title your Creation</font></h1>
    <form method="POST" enctype="multipart/form-data" class="col-8 mx-auto card p-4 shadow-lg" style="margin-top:1%;">

       {% csrf_token %}
        <div class="container page-card">
            <div class="form-row">
            <div class="form-group col-md-6">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
              </div>
              <div class="form-group col-md-6">
                <label for="username">Name</label>
                <input type="text" class="form-control" id="username" name="username" required>
              </div>
              </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="book_name">Title</label>
            <input type="text" class="form-control" id="book_name" name="book_name" required>
          </div>
          <div class="form-group col-md-6">
            <label for="author_name">Author</label>
            <input type="text" class="form-control" id="author_name" name="author_name" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-4">
            <label for="book_chapter">Total Chapters</label>
            <input type="text" class="form-control" id="book_chapter" name="book_chapter" required>
          </div>
          <div class="form-group col-md-4">
            <label for="book_category">Book Genre</label>
            <select  id="book_category" name="book_category" class="form-control">
              <option selected>~Category~</option>
              <option>Classic</option>
                <option>Mystery</option>
                <option>Romantic</option>
                <option>Adventure</option>
                <option>Fiction</option>
                <option>Spiritual</option>
            </select>
          </div>
          <div class="form-group col-md-4">
            <label for="book_pages">Total Pages</label>
            <input type="text" class="form-control" id="book_pages" name="book_pages" required>
          </div>
        </div>
        <div class="form-group">
            <div class="form-row">
                    <div class="form-group col-md-4">      
           <label for="book_agegroup">Age group</label>
            <select  id="book_agegroup" name="book_agegroup" class="form-control">
              <option selected>~Category~</option>
              <option>Kids</option>
                <option>Young</option>
                <option>Adult</option>
                
            </select> </div>
                <div class="form-group col-md-4">      
            <label for="book_file">Book's Pdf</label>
            <input type="file" class="form-control-file" id="book_file" name="book_file" required>
            </div>

            <div class="form-group col-md-4">      
                <label for="book_img">Cover Image</label>
                <input type="file" class="form-control-file" id="book_img" name="book_img" required>
                </div>
            </div>
          </div>
         
        <button type="submit" name="submit" class="btn btn-lg-white" style="margin-bottom: 1%;  border-color:rgb(239, 73, 136); background-color:white;">Add book</button>
      </div>
      </form>
    </section>
    <h1 style="text-align: center; margin-top:2%;"><font font-weight="bold" face="Gabriola">Your Personal Library</font></h1>
    <hr style="margin-bottom: 1.5%;"></section>   
<div class="container-fluid" style="margin-top:2%;">
  <div class="row">
  {% for books in viewbook %}
  <div class="col-md-2">
<div class="card" style="width: 12rem; height:24rem; margin-right:0%; margin-left:1%;margin-top: 10px;">
  <h6 style="margin-left: 10px;">{{books.username}}</h6>
<img src= "/media/{{ books.book_img }}" class="card-img-top" style="width:190px; height:220px;">
<div class="card-body">
<h5 class="card-title">{{books.book_name}}</h5>
<div class="d-flex flex-column gap-2">
    <a href="{% url 'book_details' books.id %}" class="btn btn-primary btn-sm">View Details</a>
    <a href="/delete_book/{{books.id}}" class="btn btn-danger btn-sm">Delete</a>
</div>
</div>
</div>
</div>

{% endfor %}
</div>
</div>

      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
      <script src="https://kit.fontawesome.com/220cb8914d.js" crossorigin="anonymous"></script>
      <script>
        const themeToggleButton = document.getElementById('theme-toggle');

        function applyTheme(theme) {
            document.body.classList.remove('dark-mode', 'light-mode');

            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggleButton.textContent = '☀';
            } else {
                document.body.classList.add('light-mode');
                themeToggleButton.textContent = '🌙';
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        }

        initTheme();

        if (themeToggleButton) {
            themeToggleButton.addEventListener('click', function () {
                if (document.body.classList.contains('light-mode')) {
                    applyTheme('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    applyTheme('light');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
      </script>
      </body>
      </html>
